<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b100e">
<title>DETAILING OS</title>
<style>
:root{--bg:#0b100e;--panel:#141c18;--panel2:#1b2620;--line:#2b3a31;--text:#edf5ef;--muted:#91a197;--green:#25cc88;--red:#ff7777;--amber:#f4c66a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
header{padding:17px 16px;background:#111915;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{font-size:21px;font-weight:900;letter-spacing:1.8px}.brand span{color:var(--green)}header small{display:block;color:var(--muted);font-size:10px;letter-spacing:1px;margin-top:5px}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}.role{background:var(--panel2);border:1px solid var(--line);color:var(--green);padding:8px;border-radius:9px;font-size:12px}
main{max-width:980px;margin:auto;padding:17px 14px 105px}h1{font-size:23px;margin:5px 0 8px}h2{font-size:18px;margin:20px 0 12px}.muted,.hint{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card,.item{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px}.metric{font-size:24px;font-weight:800;margin-top:9px}.green{color:var(--green)}.red{color:var(--red)}.amber{color:var(--amber)}
button,select,input,textarea{font:inherit}button{cursor:pointer}.btn{border:0;border-radius:10px;padding:12px 14px;background:var(--green);color:#07130d;font-weight:700}.btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.btn.danger{background:#492626;color:#ffdede}.btn.small{padding:8px 10px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
input,select,textarea{width:100%;padding:12px;margin:6px 0 11px;background:#0f1712;color:var(--text);border:1px solid #34463a;border-radius:9px;outline:none}label{font-size:12px;color:#b6c4ba}textarea{min-height:75px;resize:vertical}
.formbox{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px;margin-top:12px}
nav{position:fixed;bottom:0;left:0;right:0;background:#111915;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 2px calc(8px + env(safe-area-inset-bottom));z-index:8}
nav button{background:none;border:0;color:var(--muted);font-size:10px;padding:5px 3px;min-width:0;flex:1}nav button b{display:block;font-size:19px;font-weight:400;margin-bottom:3px}nav button.active{color:var(--green)}
.item{margin:9px 0}.itemhead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.pill{display:inline-block;padding:5px 8px;border-radius:20px;background:#20372b;color:var(--green);font-size:10px}.pill.gray{background:#29332d;color:#c4cec7}.pill.amber{background:#40351e;color:var(--amber)}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.hidden{display:none!important}.empty{color:var(--muted);padding:18px;text-align:center;border:1px dashed var(--line);border-radius:12px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{text-align:left;padding:9px 5px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:500}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.layout{display:grid;grid-template-columns:1fr 1fr;gap:12px}}
</style>
</head>
<body>
<header><div class="topline"><div><div class="brand">DETAILING <span>OS</span></div><small>УПРАВЛЕНИЕ ДЕТЕЙЛИНГ-ЦЕНТРОМ</small></div><select class="role" id="roleSelect" aria-label="Режим доступа" onchange="setRole(this.value)"><option value="owner">Владелец</option><option value="manager">Управляющий</option></select></div></header>
<main id="app"></main>
<nav id="nav">
<button class="active" data-page="home" onclick="go('home',this)"><b>⌂</b>Главная</button>
<button data-page="orders" onclick="go('orders',this)"><b>▣</b>Заказы</button>
<button data-page="clients" onclick="go('clients',this)"><b>♙</b>Клиенты</button>
<button data-page="tasks" onclick="go('tasks',this)"><b>✓</b>Задачи</button>
<button data-page="finance" onclick="go('finance',this)"><b>₺</b>Финансы</button>
</nav>
<script>
const KEY='detailing_os_v2';
let db=JSON.parse(localStorage.getItem(KEY)||'{"clients":[],"orders":[],"expenses":[],"tasks":[]}');
db.clients ||= []; db.orders ||= []; db.expenses ||= []; db.tasks ||= [];
let role=localStorage.getItem('dos_role')||'owner', currentPage='home';
const app=document.getElementById('app');
const money=n=>new Intl.NumberFormat('ru-MD',{style:'currency',currency:'MDL',maximumFractionDigits:2}).format(Number(n)||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function setRole(v){role=v;localStorage.setItem('dos_role',v);render(currentPage)}
function go(p,btn){currentPage=p;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===p));render(p)}
function ownerOnly(){return role==='owner'}
function statusPill(s){return `<span class="pill ${s==='Готов'||s==='Выполнена'?'':'amber'}">${esc(s)}</span>`}
function clientName(id){return db.clients.find(c=>c.id===id)?.name||'Клиент удалён'}
function orderSum(list){return list.reduce((a,o)=>a+Number(o.price||0),0)}
function render(p){
 currentPage=p; document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===p));
 let revenue=orderSum(db.orders.filter(o=>o.status==='Готов'));
 let expenses=db.expenses.reduce((a,e)=>a+Number(e.amount||0),0);
 if(p==='home'){
  app.innerHTML=`<div class="muted">ПАНЕЛЬ ${role==='owner'?'ВЛАДЕЛЬЦА':'УПРАВЛЯЮЩЕГО'} · ${new Date().toLocaleDateString('ru-MD')}</div><h1>Обзор центра</h1>
  <div class="grid">
   <div class="card"><div class="muted">Заказов всего</div><div class="metric">${db.orders.length}</div></div>
   <div class="card"><div class="muted">В работе</div><div class="metric">${db.orders.filter(o=>o.status==='В работе').length}</div></div>
   <div class="card"><div class="muted">Клиентов</div><div class="metric">${db.clients.length}</div></div>
   <div class="card"><div class="muted">Задач открыто</div><div class="metric">${db.tasks.filter(t=>t.status!=='Выполнена').length}</div></div>
  </div>
  ${ownerOnly()?`<h2>Финансовые показатели</h2><div class="grid"><div class="card"><div class="muted">Выручка по готовым заказам</div><div class="metric green">${money(revenue)}</div></div><div class="card"><div class="muted">Расходы</div><div class="metric">${money(expenses)}</div></div><div class="card"><div class="muted">Разница</div><div class="metric ${revenue-expenses>=0?'green':'red'}">${money(revenue-expenses)}</div></div><div class="card"><div class="muted">Средний чек готовых заказов</div><div class="metric">${money(db.orders.filter(o=>o.status==='Готов').length?revenue/db.orders.filter(o=>o.status==='Готов').length:0)}</div></div></div>`:`<h2>Рабочая панель</h2><p class="muted">Создавайте заказы, добавляйте клиентов и контролируйте выполнение задач.</p>`}
  <h2>Быстрые действия</h2><div class="actions"><button class="btn" onclick="go('neworder')">＋ Заказ</button><button class="btn secondary" onclick="go('newclient')">＋ Клиент</button><button class="btn secondary" onclick="go('newtask')">＋ Задача</button>${ownerOnly()?'<button class="btn secondary" onclick="go(\\'newexpense\\')">＋ Расход</button>':''}</div>
  <h2>Последние заказы</h2>${db.orders.slice().reverse().slice(0,5).map(orderCard).join('')||'<div class="empty">Заказов пока нет</div>'}`;
 }
 if(p==='orders'){
  app.innerHTML=`<h1>Заказы</h1><button class="btn" onclick="go('neworder')">＋ Создать заказ</button><div class="actions"><select id="orderFilter" onchange="filterOrders()"><option value="">Все статусы</option><option>Запланирован</option><option>В работе</option><option>Готов</option></select></div><div id="orderList">${db.orders.slice().reverse().map(orderCard).join('')||'<div class="empty">Заказов пока нет</div>'}</div>`;
 }
 if(p==='clients'){
  app.innerHTML=`<h1>Клиенты</h1><button class="btn" onclick="go('newclient')">＋ Добавить клиента</button><input id="clientSearch" placeholder="Поиск по имени, телефону или авто" oninput="filterClients()"><div id="clientList">${db.clients.map(clientCard).join('')||'<div class="empty">Клиентов пока нет</div>'}</div>`;
 }
 if(p==='client'){
  let c=db.clients.find(x=>x.id===window.selectedClient); if(!c){go('clients');return}
  let hist=db.orders.filter(o=>o.clientId===c.id).slice().reverse();
  app.innerHTML=`<button class="btn secondary small" onclick="go('clients')">← К списку клиентов</button><h1>${esc(c.name)}</h1><div class="card"><div>${esc(c.phone||'Телефон не указан')}</div><div class="muted">${esc(c.notes||'')}</div><div class="metric">${hist.length} заказ(ов)</div><div class="muted">Всего заказано: ${money(orderSum(hist))}</div></div><h2>Автомобили и история работ</h2>${hist.map(orderCard).join('')||'<div class="empty">История работ пока пустая</div>'}<button class="btn" onclick="go('neworder');setTimeout(()=>{let s=document.getElementById('orderClient');if(s)s.value=c.id},0)">＋ Новый заказ этому клиенту</button>`;
 }
 if(p==='tasks'){
  app.innerHTML=`<h1>Задачи</h1><button class="btn" onclick="go('newtask')">＋ Поставить задачу</button>${db.tasks.slice().reverse().map((t,i)=>`<div class="item"><div class="itemhead"><b>${esc(t.title)}</b>${statusPill(t.status)}</div><p class="muted">${esc(t.assignee||'Без ответственного')} · срок: ${esc(t.due||'не задан')}</p>${esc(t.details||'')}<div class="actions"><button class="btn small secondary" onclick="toggleTask('${t.id}')">${t.status==='Выполнена'?'Вернуть в работу':'Отметить выполненной'}</button></div></div>`).join('')||'<div class="empty">Задач пока нет</div>'}`;
 }
 if(p==='finance'){
  if(!ownerOnly()){app.innerHTML='<h1>Финансы</h1><div class="empty">Подробные финансовые отчёты доступны в режиме владельца.</div>';return}
  app.innerHTML=`<h1>Финансы · MDL</h1><div class="grid"><div class="card"><div class="muted">Выручка готовых заказов</div><div class="metric green">${money(revenue)}</div></div><div class="card"><div class="muted">Расходы</div><div class="metric">${money(expenses)}</div></div><div class="card"><div class="muted">Операционная разница</div><div class="metric">${money(revenue-expenses)}</div></div><div class="card"><div class="muted">Незавершённые заказы</div><div class="metric">${db.orders.filter(o=>o.status!=='Готов').length}</div></div></div><button class="btn" onclick="go('newexpense')">＋ Записать расход</button><h2>История расходов</h2>${db.expenses.slice().reverse().map(e=>`<div class="item"><b>${esc(e.title)}</b><span style="float:right">${money(e.amount)}</span><div class="muted">${esc(e.date)}</div></div>`).join('')||'<div class="empty">Расходов пока нет</div>'}<h2>Выручка по услугам</h2>${serviceReport()}`;
 }
 if(p==='newclient') app.innerHTML=`<h1>Новый клиент</h1><div class="formbox"><label>Имя клиента *</label><input id="cName" placeholder="Например, Иван"><label>Телефон</label><input id="cPhone" placeholder="+373..."><label>Заметка</label><textarea id="cNotes" placeholder="Предпочтения, важная информация"></textarea><button class="btn" onclick="addClient()">Сохранить клиента</button></div>`;
 if(p==='neworder') app.innerHTML=`<h1>Новый заказ</h1><div class="formbox"><label>Клиент *</label><select id="orderClient"><option value="">Выберите клиента</option>${db.clients.map(c=>`<option value="${c.id}">${esc(c.name)} · ${esc(c.phone||'без телефона')}</option>`).join('')}</select><div class="hint">Если клиента ещё нет, сначала добавьте его в разделе «Клиенты».</div><label>Автомобиль *</label><input id="oCar" placeholder="Марка, модель, номер"><label>Услуга *</label><input id="oService" placeholder="Например, полировка кузова"><div class="row"><div><label>Стоимость, MDL *</label><input id="oPrice" type="number" min="0" step="0.01" placeholder="0"></div><div><label>Дата</label><input id="oDate" type="date" value="${today()}"></div></div><label>Статус</label><select id="oStatus"><option>Запланирован</option><option>В работе</option><option>Готов</option></select><label>Комментарий</label><textarea id="oNote" placeholder="Дополнительная информация"></textarea><button class="btn" onclick="addOrder()">Сохранить заказ</button></div>`;
 if(p==='newtask') app.innerHTML=`<h1>Новая задача</h1><div class="formbox"><label>Название задачи *</label><input id="tTitle" placeholder="Например, подготовить автомобиль к выдаче"><label>Ответственный</label><input id="tAssignee" placeholder="Имя сотрудника"><label>Срок</label><input id="tDue" type="date"><label>Описание</label><textarea id="tDetails" placeholder="Что необходимо сделать"></textarea><button class="btn" onclick="addTask()">Создать задачу</button></div>`;
 if(p==='newexpense'){
  if(!ownerOnly()){go('home');return}
  app.innerHTML=`<h1>Новый расход</h1><div class="formbox"><label>Название расхода *</label><input id="eTitle" placeholder="Закупка химии, аренда..."><label>Сумма, MDL *</label><input id="eAmount" type="number" min="0" step="0.01" placeholder="0"><label>Дата</label><input id="eDate" type="date" value="${today()}"><button class="btn" onclick="addExpense()">Сохранить расход</button></div>`;
 }
}
function orderCard(o){return `<div class="item"><div class="itemhead"><b>${esc(o.car)}</b>${statusPill(o.status)}</div><div>${esc(o.service)} · <b>${money(o.price)}</b></div><div class="muted">Клиент: ${esc(clientName(o.clientId))} · ${esc(o.date||'')}</div>${o.note?`<div class="muted">${esc(o.note)}</div>`:''}<div class="actions"><button class="btn small secondary" onclick="openClient('${o.clientId}')">Карточка клиента</button><button class="btn small secondary" onclick="cycleOrder('${o.id}')">Изменить статус</button></div></div>`}
function clientCard(c){let n=db.orders.filter(o=>o.clientId===c.id).length;return `<div class="item" onclick="openClient('${c.id}')" style="cursor:pointer"><div class="itemhead"><b>${esc(c.name)}</b><span class="pill gray">${n} работ</span></div><div class="muted">${esc(c.phone||'Телефон не указан')}</div><div class="muted">${esc(c.notes||'Нажмите, чтобы открыть историю')}</div></div>`}
function addClient(){let name=document.getElementById('cName').value.trim();if(!name)return alert('Введите имя клиента');db.clients.push({id:crypto.randomUUID(),name,phone:document.getElementById('cPhone').value.trim(),notes:document.getElementById('cNotes').value.trim(),created:today()});save();go('clients')}
function addOrder(){let clientId=document.getElementById('orderClient').value,car=document.getElementById('oCar').value.trim(),service=document.getElementById('oService').value.trim(),price=Number(document.getElementById('oPrice').value);if(!clientId||!car||!service||price<=0)return alert('Выберите клиента и заполните автомобиль, услугу и стоимость');db.orders.push({id:crypto.randomUUID(),clientId,car,service,price,status:document.getElementById('oStatus').value,date:document.getElementById('oDate').value,note:document.getElementById('oNote').value.trim()});save();go('orders')}
function addTask(){let title=document.getElementById('tTitle').value.trim();if(!title)return alert('Введите название задачи');db.tasks.push({id:crypto.randomUUID(),title,assignee:document.getElementById('tAssignee').value.trim(),due:document.getElementById('tDue').value,details:document.getElementById('tDetails').value.trim(),status:'В работе'});save();go('tasks')}
function addExpense(){let title=document.getElementById('eTitle').value.trim(),amount=Number(document.getElementById('eAmount').value);if(!title||amount<=0)return alert('Заполните название и сумму');db.expenses.push({id:crypto.randomUUID(),title,amount,date:document.getElementById('eDate').value});save();go('finance')}
function openClient(id){window.selectedClient=id;go('client')}
function cycleOrder(id){let o=db.orders.find(x=>x.id===id);if(!o)return;let a=['Запланирован','В работе','Готов'];o.status=a[(a.indexOf(o.status)+1)%a.length];save();render(currentPage)}
function toggleTask(id){let t=db.tasks.find(x=>x.id===id);if(!t)return;t.status=t.status==='Выполнена'?'В работе':'Выполнена';save();render('tasks')}
function filterOrders(){let f=document.getElementById('orderFilter').value;document.getElementById('orderList').innerHTML=db.orders.filter(o=>!f||o.status===f).slice().reverse().map(orderCard).join('')||'<div class="empty">Нет заказов с таким статусом</div>'}
function filterClients(){let q=document.getElementById('clientSearch').value.toLowerCase();document.getElementById('clientList').innerHTML=db.clients.filter(c=>(c.name+' '+c.phone+' '+c.notes).toLowerCase().includes(q)).map(clientCard).join('')||'<div class="empty">Ничего не найдено</div>'}
function serviceReport(){let map={};db.orders.filter(o=>o.status==='Готов').forEach(o=>map[o.service]=(map[o.service]||0)+Number(o.price));let entries=Object.entries(map);return entries.length?entries.map(([s,v])=>`<div class="item">${esc(s)}<b style="float:right">${money(v)}</b></div>`).join(''):'<div class="empty">Пока нет завершённых заказов</div>'}
document.getElementById('roleSelect').value=role;
render('home');
</script>
</body>
</html>
